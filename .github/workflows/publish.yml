name: Build and Publish Docker Image

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set Docker Image and Tags
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ghcr.io/mitre-attack/attack-navigator
          tags: |
            # set semver tag (vX.Y.Z) on git tag event
            type=semver,pattern=v{{major}}.{{minor}}.{{patch}}
            # set git short commit as Docker tag (e.g., sha-ad132f5)
            type=sha
      - name: Confirm Docker publish trigger
        run: |
          echo "Docker publish workflow triggered"
          echo "ref=${GITHUB_REF}"
          echo "ref_name=${GITHUB_REF_NAME}"
          echo "sha=${GITHUB_SHA}"
          echo "tags<<EOF"
          echo "${{ steps.meta.outputs.tags }}"
          echo "EOF"
          echo "labels<<EOF"
          echo "${{ steps.meta.outputs.labels }}"
          echo "EOF"
